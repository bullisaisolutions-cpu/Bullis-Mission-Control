<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#184d3b">
<title>Bullis Mission Control 2.0</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="icon" href="assets/icons/icon-192.png">
</head>
<body>
<div class="shell">
<aside>
<h2>BMC 2.0</h2>
<nav>
<button data-view="dashboard" class="active">Dashboard</button>
<button data-view="missions">Missions</button>
<button data-view="rachel">Rachel</button>
<button data-view="calendar">Calendar</button>
<button data-view="prayer">Prayer</button>
<button data-view="notes">Notes</button>
<button data-view="people">People</button>
<button data-view="settings">Settings</button>
</nav>
</aside>
<section class="workspace">
<header><h1 id="title">Dashboard</h1><button id="quickAdd">Quick Add</button></header>
<main id="app"></main>
</section>
</div>
<dialog id="quickDialog">
<form method="dialog" id="quickForm">
<h2>Quick Add</h2>
<select id="type">
<option value="missions">Mission</option>
<option value="notes">Note</option>
<option value="prayers">Prayer</option>
<option value="people">Person</option>
<option value="events">Calendar event</option>
</select>
<input id="itemTitle" placeholder="Title" required>
<textarea id="details" placeholder="Details"></textarea>
<div class="row"><button value="cancel">Cancel</button><button id="saveItem" value="default">Save</button></div>
</form>
</dialog>
<script type="module" src="assets/js/app.js"></script>
</body>
</html>
